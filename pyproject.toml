[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwave"
version = "0.1.0.dev0"
description = "Scan, detect and play publicly broadcast FM radio and digital TV services"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mxlione" }]
keywords = ["sdr", "rtl-sdr", "fm-radio", "dvb-t", "signal-processing", "radio"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
rtlsdr = ["pyrtlsdr>=0.3"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12.0"]
media = ["python-vlc>=3.0"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Mxlione/Openwave"
Repository = "https://github.com/Mxlione/Openwave"
Issues = "https://github.com/Mxlione/Openwave/issues"

[project.scripts]
openwave = "openwave.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openwave"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "BLE",      # blind-except: catching bare Exception needs a stated reason
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "N803",  # argument name should be lowercase (DSP uses N, M, Fs)
    "N806",  # variable in function should be lowercase (same reason)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["openwave"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rtlsdr.*", "vlc.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
# src is included so the doctests in docstrings are run too: an example that no longer works is
# worse than no example, because somebody will copy it.
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers --doctest-modules"
markers = [
    "hardware: requires a physical SDR or DVB-T receiver (skipped in CI)",
    "media: requires libVLC and the python-vlc bindings",
    "slow: takes more than a few seconds",
]
filterwarnings = [
    # Starlette's own notice about httpx, which OpenWave does not choose and cannot act on.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src/openwave"]
branch = true
