[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwave"
# Read from src/openwave/__init__.py, so that the version a user sees from `openwave --version`
# and the version pip installed can never disagree.
dynamic = ["version"]
description = "Scan, detect and play publicly broadcast FM radio and digital TV services"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mxlione" }]
keywords = ["sdr", "rtl-sdr", "fm-radio", "dvb-t", "signal-processing", "radio"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
rtlsdr = ["pyrtlsdr>=0.3"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12.0"]
media = ["python-vlc>=3.0"]
# Bounded below 2.0 deliberately: the Material theme's own notice says MkDocs 2.0 removes
# the plugin system with no migration path, so an unbounded dependency would break the docs
# build on an upgrade nobody asked for.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Mxlione/Openwave"
Repository = "https://github.com/Mxlione/Openwave"
Issues = "https://github.com/Mxlione/Openwave/issues"

[project.scripts]
openwave = "openwave.cli:app"

[tool.hatch.version]
path = "src/openwave/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openwave"]
# The built interface, when there is one. The release workflow builds it and copies it to
# src/openwave/interface before building the wheel, so a released wheel serves the interface
# with no Node installed. A checkout has no such directory, and the API finds the build output
# in frontend/dist instead.
artifacts = ["src/openwave/interface/**"]

[tool.hatch.build.targets.sdist]
# The source distribution carries the interface's sources and the schema its types come from,
# but not node_modules or a build.
include = [
    "/src",
    "/tests",
    "/docs",
    "/scripts",
    "/packaging",
    "/frontend/src",
    "/frontend/public",
    "/frontend/openapi.json",
    "/frontend/package.json",
    "/frontend/package-lock.json",
    "/frontend/angular.json",
    "/frontend/tsconfig*.json",
    "/frontend/README.md",
    "/mkdocs.yml",
    "/README.md",
    "/README.fr.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/TASKS.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "BLE",      # blind-except: catching bare Exception needs a stated reason
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "N803",  # argument name should be lowercase (DSP uses N, M, Fs)
    "N806",  # variable in function should be lowercase (same reason)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["openwave"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rtlsdr.*", "vlc.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
# src is included so the doctests in docstrings are run too: an example that no longer works is
# worse than no example, because somebody will copy it.
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers --doctest-modules"
markers = [
    "hardware: requires a physical SDR or DVB-T receiver (skipped in CI)",
    "media: requires libVLC and the python-vlc bindings",
    "slow: takes more than a few seconds",
]
filterwarnings = [
    # Starlette's own notice about httpx, which OpenWave does not choose and cannot act on.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src/openwave"]
branch = true
