name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check --diff .

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,api]"

      - name: Mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,api]"

      # The whole suite runs against simulated receivers, so no hardware is needed.
      # Anything that genuinely needs a receiver is marked @pytest.mark.hardware.
      - name: Pytest
        run: pytest -m "not hardware" --cov --cov-report=term-missing

  media:
    name: Playback (libVLC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # libVLC itself, which the Python bindings load at run time. This is the one
      # hardware-adjacent path OpenWave can genuinely verify in CI: unlike an RTL-SDR dongle,
      # libVLC runs on an ordinary runner.
      - name: Install libVLC
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvlc-dev

      - name: Install
        run: pip install -e ".[dev,media]"

      - name: Playback tests
        run: pytest -m media -v

  frontend:
    name: Interface (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 20 accepts 20.19 and above. Pinned to the major rather than to 'latest',
          # because a new major of Node has broken the Angular toolchain before.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # The schema is checked in, so this catches a backend change that was made without
      # regenerating it -- which would otherwise show up as a type error only on somebody
      # else's machine.
      - name: Check the API types are in step with the schema
        run: |
          npm run generate:api
          git diff --exit-code src/app/api/schema.d.ts

      # Building is the type check: Angular compiles the templates as well as the TypeScript,
      # so a template referring to a field the API no longer returns fails here.
      - name: Build
        run: npm run build

      - name: Tests
        run: npm test -- --no-watch --no-progress --browsers=ChromeHeadless

  schema:
    name: API schema is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[api]"

      # Checked in rather than fetched from a running server, so a change to the API shows up
      # as a diff in a pull request rather than as a surprise to a client.
      - name: Regenerate and compare
        run: |
          python scripts/export_openapi.py
          git diff --exit-code frontend/openapi.json

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
